model_name_or_path: /path/to/your/base-model

stage: sft
do_train: true
finetuning_type: lora
lora_target: all

dataset_dir: /path/to/llamafactory/data
dataset: text2sql_agent_train
eval_dataset: text2sql_agent_val
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: saves/text2sql-agent/action-focused-lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0

bf16: true
ddp_timeout: 180000000

eval_strategy: steps
eval_steps: 100

