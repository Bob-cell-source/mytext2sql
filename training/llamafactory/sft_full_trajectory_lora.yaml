model_name_or_path: /path/to/your/base-model

stage: sft
do_train: true
finetuning_type: lora
lora_target: all

dataset_dir: /path/to/llamafactory/data
dataset: text2sql_agent_train_full_trajectory
eval_dataset: text2sql_agent_val_full_trajectory
template: qwen
cutoff_len: 6144
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: saves/text2sql-agent/full-trajectory-lora
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 8.0e-5
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0

bf16: true
ddp_timeout: 180000000

eval_strategy: steps
eval_steps: 50
